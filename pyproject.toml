[tool.poetry]
name = "shef-parser"
repository = "https://github.com/HydrologicEngineeringCenter/SHEF_processing"

version = "1.11.0"


packages = [
    { include = "shef" },
]
description = "Module to extract data from SHEF formated files with ability to save output as flat file, HEC-DSS file, or directly into Corps water management systems (CWMS) database"
readme = "README.md"
license = "LICENSE"
keywords = ["SHEF","USACE", "CWMS", "DSS"]
authors = ["Hydrologic Engineering Center"]

[tool.poetry.dependencies]
python = "^3.9"
click = "^8.1"
cwms-python = { version = "^1.0.8", optional = true }
hecdss = { version = "^0.1.29", optional = true }
sphinx = { version = "^7.0", optional = true }
sphinx_rtd_theme = { version = "^2.0", optional = true }
sphinx-design = { version = "^0.5", optional = true }

[tool.poetry.extras]
docs = ["sphinx", "sphinx_rtd_theme", "sphinx-design"]
cda = ["cwms-python"]
dss = ["hecdss"]

[tool.poetry.group.dev.dependencies]
black = {version = "^26.3.1", python = "^3.10"}
isort = "^5.13.2"
mypy = "^1.9.0"
pre-commit = "^3.6.2"
pytest = {version = "^9.0.3", python = "^3.10"}
pytest-cov = "^4.1.0"
#pandas-stubs = "^2.2.1.240316"
yamlfix = "^1.16.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.yamlfix]
comments_min_spaces_from_content = 1
whitelines = 1
explicit_start = false
preserve_quotes = true

[tool.poetry.scripts]
shefParser = "shef.shef_parser:cli"

